# =========================================================
# Bank — ambiente de infraestrutura local
#
# Contratos (portas, endpoints, credenciais e comandos):
#   specs/001-infra-local/contracts/ambiente-local.md
#   specs/002-setup-api/contracts/api-base.md (serviço api)
#   specs/003-usuarios-carteiras/contracts/usuarios-carteiras-api.md (banco e JWT da api)
#   specs/004-frontend-base/contracts/frontend.md (serviço frontend)
#   specs/010-mensageria-rabbitmq/contracts/topologia-e-mensagens.md (serviço worker)
#
# Subir:  docker compose up -d --wait
# Parar:  docker compose down        (mantém os dados)
# Reset:  docker compose down -v     (apaga os dados)
#
# Configuração opcional via .env (ver .env.example). Portas publicadas só em 127.0.0.1.
# =========================================================

name: bank

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bank_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bank}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+: o volume fica em /var/lib/postgresql (não em .../data) — research R5
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # $$ = variável resolvida dentro do contêiner, não pelo Compose
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    # Hostname fixo: o nome do nó (e o diretório de dados) deriva dele — research R5
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bank}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-bank_dev_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-bank}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # Confirma que os listeners (AMQP e Management) aceitam conexões — research R3
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  aspire-dashboard:
    # Imagem oficial (mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5) + BusyBox para o
    # healthcheck, pois a oficial é distroless — ver docker/aspire-dashboard/Dockerfile
    build: ./docker/aspire-dashboard
    image: bank/aspire-dashboard:13.6.5
    environment:
      # Sem autenticação: aceitável porque as portas só escutam em 127.0.0.1 — research R7
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "127.0.0.1:${ASPIRE_DASHBOARD_PORT:-18888}:18888" # UI
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:18889"         # OTLP/gRPC
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:18890"         # OTLP/HTTP
    # Telemetria fica só em memória (sem volume) e o serviço não depende de outros — R1, R4
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:18888/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    # API do Bank — specs/002-setup-api (research R8)
    build:
      context: ./src/backend
      target: api
    image: bank/api:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      # PostgreSQL do Compose (specs/003-usuarios-carteiras, research R7)
      ConnectionStrings__Bank: Host=postgres;Port=5432;Database=${POSTGRES_DB:-bank};Username=${POSTGRES_USER:-bank};Password=${POSTGRES_PASSWORD:-bank_dev_password}
      # Chave JWT só de desenvolvimento (research R4); mesmo padrão do .env.example
      Jwt__ChaveAssinatura: ${JWT_CHAVE_ASSINATURA:-bank-dev-only-jwt-signing-key-change-me-0123456789}
      # Limites de transferência PF (specs/009-limite-transferencia, research R2). Sem ":" no
      # padrão: variável vazia desliga o limite; só a não definida usa o valor padrão.
      Transferencias__Limites__PessoaFisica__PorOperacao: ${LIMITE_PF_POR_OPERACAO-1000.00}
      Transferencias__Limites__PessoaFisica__Diario: ${LIMITE_PF_DIARIO-5000.00}
      # Cartão de crédito (specs/014-cartao-credito-cobrancas, research R1 e R13). Chave só de
      # desenvolvimento: trocá-la muda o número e o CVV de todos os cartões.
      Cartoes__ChaveDerivacao: ${CARTOES_CHAVE_DERIVACAO:-bank-dev-only-card-derivation-key-change-me-0123456789}
      Cartoes__LimitePadrao: ${LIMITE_CARTAO_PADRAO:-5000.00}
      Cartoes__JurosAtrasoMensalPercentual: ${JUROS_ATRASO_MENSAL:-15.00}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # O coletor não bloqueia a API: sem ele, a telemetria é descartada (SC-006)
      aspire-dashboard:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    # Despachante do outbox e consumidores do RabbitMQ — specs/010-mensageria-rabbitmq (R1).
    # Sem porta publicada: só o healthcheck usa o HTTP interno.
    build:
      context: ./src/backend
      target: worker
    image: bank/worker:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      ConnectionStrings__Bank: Host=postgres;Port=5432;Database=${POSTGRES_DB:-bank};Username=${POSTGRES_USER:-bank};Password=${POSTGRES_PASSWORD:-bank_dev_password}
      Mensageria__Host: rabbitmq
      Mensageria__VirtualHost: ${RABBITMQ_VHOST:-bank}
      Mensageria__Usuario: ${RABBITMQ_USER:-bank}
      Mensageria__Senha: ${RABBITMQ_PASSWORD:-bank_dev_password}
    depends_on:
      # A API aplica as migrations na partida (research R9)
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    healthcheck:
      # Pronto = conectado ao broker e consumidores inscritos
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health/pronto"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    # Frontend React servido por nginx — specs/004-frontend-base (research R4, R9).
    # /api e /otlp são encaminhados pelo nginx para a api e o coletor (mesma origem, sem CORS).
    build:
      context: ./src/frontend
      args:
        VITE_TELEMETRIA_HABILITADA: "true"
    image: bank/frontend:local
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/saude"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
