<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bank — Criar conta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="min-height: 900px; background: #F5F7FA; font-family: Inter, system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column">
  <header style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 32px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1D4ED8"></rect><path d="M10 9h7a4 4 0 0 1 0 8h-7zM10 17h8a4 4 0 0 1 0 8h-8z" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"></path></svg>
      <span style="font-size: 18px; line-height: 24px; font-weight: 700">Bank</span>
    </div>
    <span style="font-size: 14px; line-height: 20px; color: #475569">Já tem conta? <a href="D-Login.dc.html" style="font-weight: 600; text-decoration: none">Entrar</a></span>
  </header>

  <main style="flex: 1; display: flex; justify-content: center; padding: 48px 24px; box-sizing: border-box">
    <form style="width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -0.01em">Criar conta</h1>
        <p style="margin: 0; font-size: 16px; line-height: 24px; color: #475569">Sua carteira digital é criada junto com a conta.</p>
      </div>

      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 12px">
        <legend style="padding: 0; margin-bottom: 12px; font-size: 14px; line-height: 20px; font-weight: 500">Tipo de conta</legend>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <sc-for list="{{ tipos }}" as="t" hint-placeholder-count="2">
            <button type="button" onClick="{{ t.pick }}" aria-pressed="{{ t.pressed }}" style="{{ t.style }}">
              <span style="font-size: 16px; line-height: 24px; font-weight: 600">{{ t.titulo }}</span>
              <span style="font-size: 14px; line-height: 20px; color: #475569">{{ t.desc }}</span>
            </button>
          </sc-for>
        </div>
        <p style="margin: 0; font-size: 12px; line-height: 16px; color: #475569">O tipo de conta não pode ser alterado depois do cadastro.</p>
      </fieldset>

      <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 28px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
        <div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px">
          <label for="dc-nome" style="font-size: 14px; line-height: 20px; font-weight: 500">{{ rotuloNome }}</label>
          <input id="dc-nome" autocomplete="name" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 10px; font: 400 16px/24px Inter, sans-serif; color: #0F172A">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="dc-doc" style="font-size: 14px; line-height: 20px; font-weight: 500">{{ rotuloDoc }}</label>
          <input id="dc-doc" inputmode="numeric" placeholder="{{ mascaraDoc }}" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 10px; font: 400 16px/24px Inter, sans-serif; color: #0F172A">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="dc-email" style="font-size: 14px; line-height: 20px; font-weight: 500">E-mail</label>
          <input id="dc-email" type="email" autocomplete="email" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 10px; font: 400 16px/24px Inter, sans-serif; color: #0F172A">
        </div>
        <div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px">
          <label for="dc-senha" style="font-size: 14px; line-height: 20px; font-weight: 500">Senha</label>
          <input id="dc-senha" type="password" autocomplete="new-password" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 10px; font: 400 16px/24px Inter, sans-serif; color: #0F172A">
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 4px" aria-hidden="true">
            <div style="height: 4px; border-radius: 2px; background: #047857"></div>
            <div style="height: 4px; border-radius: 2px; background: #047857"></div>
            <div style="height: 4px; border-radius: 2px; background: #047857"></div>
            <div style="height: 4px; border-radius: 2px; background: #E2E8F0"></div>
          </div>
          <span style="font-size: 12px; line-height: 16px; color: #475569">Senha boa. Use 8 ou mais caracteres, com letras, números e símbolos.</span>
        </div>
      </div>

      <div style="display: flex; gap: 12px; align-items: center; padding: 16px; border-radius: 12px; background: #EFF4FF; border: 1px solid #C7D7FE">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>
        <span style="font-size: 14px; line-height: 20px">{{ saldoInicial }}</span>
      </div>

      <a href="{{ destino }}" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 10px; background: #1D4ED8; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 600; text-decoration: none">Criar conta</a>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tipo: 'PF' }; }
  renderVals() {
    const pf = this.state.tipo === 'PF';
    const base = 'display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 16px 18px; border-radius: 12px; text-align: left; cursor: pointer; font-family: Inter, sans-serif; color: #0F172A; ';
    const on = base + 'background: #EFF4FF; border: 2px solid #1D4ED8;';
    const off = base + 'background: #FFFFFF; border: 2px solid #E2E8F0;';
    return {
      tipos: [
        { titulo: 'Pessoa Física', desc: 'Conta com CPF. Envia e recebe transferências.', pressed: pf ? 'true' : 'false', style: pf ? on : off, pick: () => this.setState({ tipo: 'PF' }) },
        { titulo: 'Pessoa Jurídica', desc: 'Conta com CNPJ. Recebe transferências e gera cobranças.', pressed: pf ? 'false' : 'true', style: pf ? off : on, pick: () => this.setState({ tipo: 'PJ' }) }
      ],
      rotuloNome: pf ? 'Nome completo' : 'Razão social',
      rotuloDoc: pf ? 'CPF' : 'CNPJ',
      mascaraDoc: pf ? '000.000.000-00' : '00.000.000/0000-00',
      saldoInicial: pf ? 'Contas Pessoa Física começam com R$ 10,00 de saldo de demonstração.' : 'Contas Pessoa Jurídica começam com saldo de R$ 0,00.',
      destino: pf ? 'D-Inicio.dc.html' : 'D-InicioPJ.dc.html'
    };
  }
}
</script>
</body>
</html>
