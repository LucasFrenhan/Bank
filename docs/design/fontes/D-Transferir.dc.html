<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bank — Transferir</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="min-height: 900px; background: #F5F7FA; font-family: Inter, system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 16px 32px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0">
    <a href="D-Inicio.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px 0 4px; color: #0F172A; font-size: 14px; line-height: 20px; font-weight: 500; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18 9 12l6-6"></path></svg>Voltar ao início</a>
    <ol aria-label="Etapas" style="margin: 0 0 0 auto; padding: 0; list-style: none; display: flex; gap: 8px; align-items: center; font-size: 14px; line-height: 20px">
      <li aria-current="step" style="display: flex; align-items: center; gap: 8px; font-weight: 600; color: #1D4ED8"><span style="width: 24px; height: 24px; border-radius: 999px; background: #1D4ED8; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 12px">1</span>Dados</li>
      <li aria-hidden="true" style="width: 32px; height: 2px; background: #CBD5E1"></li>
      <li style="display: flex; align-items: center; gap: 8px; color: #475569"><span style="width: 24px; height: 24px; border-radius: 999px; border: 2px solid #CBD5E1; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 12px">2</span>Confirmar</li>
      <li aria-hidden="true" style="width: 32px; height: 2px; background: #CBD5E1"></li>
      <li style="display: flex; align-items: center; gap: 8px; color: #475569"><span style="width: 24px; height: 24px; border-radius: 999px; border: 2px solid #CBD5E1; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 12px">3</span>Comprovante</li>
    </ol>
  </header>

  <main style="flex: 1; display: flex; justify-content: center; padding: 48px 24px; box-sizing: border-box">
    <form style="width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 24px">
      <h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -0.01em">Transferir dinheiro</h1>

      <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="dt-doc" style="font-size: 14px; line-height: 20px; font-weight: 500">CPF ou CNPJ de quem vai receber</label>
          <input id="dt-doc" inputmode="numeric" value="12.345.678/0001-95" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 10px; font: 400 16px/24px Inter, sans-serif; color: #0F172A">
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #F5F7FA">
          <span style="flex: none; width: 40px; height: 40px; border-radius: 999px; background: #E0E7FF; color: #1D4ED8; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700" aria-hidden="true">PB</span>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <strong style="font-size: 14px; line-height: 20px">Padaria Boa Massa Ltda</strong>
            <span style="font-size: 12px; line-height: 16px; color: #475569">Pessoa Jurídica · CNPJ ••.345.678/0001-••</span>
          </div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="Destinatário encontrado" role="img" style="margin-left: auto; flex: none"><path d="m5 12 5 5 9-10"></path></svg>
        </div>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="dt-valor" style="font-size: 14px; line-height: 20px; font-weight: 500">Valor</label>
          <div style="display: flex; align-items: center; gap: 8px; height: 64px; padding: 0 16px; border: 2px solid #1D4ED8; border-radius: 12px">
            <span style="font-size: 24px; line-height: 32px; font-weight: 600; color: #475569">R$</span>
            <input id="dt-valor" inputmode="decimal" value="45,90" style="flex: 1; min-width: 0; border: 0; outline: none; font: 600 32px/40px Inter, sans-serif; color: #0F172A; font-variant-numeric: tabular-nums; background: transparent">
          </div>
          <span style="font-size: 12px; line-height: 16px; color: #475569; font-variant-numeric: tabular-nums">Disponível: R$ 842,50 · mínimo R$ 0,01</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="dt-desc" style="font-size: 14px; line-height: 20px; font-weight: 500">Descrição <span style="font-weight: 400; color: #475569">(opcional)</span></label>
          <input id="dt-desc" maxlength="200" value="Café e pães" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 10px; font: 400 16px/24px Inter, sans-serif; color: #0F172A">
          <span style="font-size: 12px; line-height: 16px; color: #475569; align-self: flex-end">10/200</span>
        </div>
      </div>

      <a href="D-Confirmar.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 10px; background: #1D4ED8; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 600; text-decoration: none">Continuar</a>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
