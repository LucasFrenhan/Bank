<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bank mobile — Início (PF)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7FA; font-family: Inter, system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column">
    <div style="background: #0F172A; color: #FFFFFF; padding: 52px 20px 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; line-height: 20px; color: #CBD5E1">Olá,</span>
          <h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">Lucas</h1>
        </div>
        <span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; background: #1E293B; color: #BFDBFE; font-size: 12px; line-height: 16px; font-weight: 600">Pessoa Física</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; line-height: 20px; color: #CBD5E1">Saldo disponível</span>
        <span style="font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">R$ 842,50</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <a href="M-Transferir.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 12px; background: #FFFFFF; color: #0F172A; font-size: 14px; line-height: 20px; font-weight: 600; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h13l-4-4M17 17H4l4 4"></path></svg>Transferir</a>
        <a href="M-Extrato.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px; border: 1px solid #475569; color: #FFFFFF; font-size: 14px; line-height: 20px; font-weight: 600; text-decoration: none">Extrato</a>
      </div>
    </div>
    <section style="margin: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; overflow: hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #E2E8F0">
        <h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Últimas movimentações</h2>
        <a href="M-Extrato.dc.html" style="padding: 8px 0; font-size: 14px; line-height: 20px; font-weight: 600; text-decoration: none">Ver tudo</a>
      </div>
      <sc-for list="{{ movs }}" as="m" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #EEF2F6">
          <span style="{{ m.iconeStyle }}" aria-hidden="true">{{ m.seta }}</span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ m.nome }}</span>
            <span style="font-size: 12px; line-height: 16px; color: #475569">{{ m.data }}</span>
          </div>
          <span style="{{ m.valorStyle }}">{{ m.valor }}</span>
        </div>
      </sc-for>
    </section>
  </div>
  <nav aria-label="Principal" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 8px 8px 28px; background: #FFFFFF; border-top: 1px solid #E2E8F0">
    <a href="M-Inicio.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: #1D4ED8; font-size: 12px; line-height: 16px; font-weight: 600; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7v9H3z"></path><path d="M9 20v-6h6v6"></path></svg>Início</a>
    <a href="M-Extrato.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: #475569; font-size: 12px; line-height: 16px; font-weight: 500; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>Extrato</a>
    <a href="M-Perfil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: #475569; font-size: 12px; line-height: 16px; font-weight: 500; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const lista = [
      { nome: 'Mariana Costa', data: 'Hoje, 14:32', valor: '+ R$ 120,00', entrada: true },
      { nome: 'Padaria Boa Massa Ltda', data: 'Hoje, 08:10', valor: '− R$ 45,90', entrada: false },
      { nome: 'Rafael Lima', data: 'Ontem, 19:47', valor: '− R$ 200,00', entrada: false },
      { nome: 'Ana Souza', data: '15 nov, 11:05', valor: '+ R$ 1.200,00', entrada: true },
      { nome: 'Oficina Rápida ME', data: '14 nov, 16:20', valor: '− R$ 241,60', entrada: false }
    ];
    return {
      movs: lista.map((m) => ({
        ...m,
        seta: m.entrada ? '↓' : '↑',
        iconeStyle: 'flex: none; width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; ' + (m.entrada ? 'background: #ECFDF3; color: #047857;' : 'background: #F1F5F9; color: #334155;'),
        valorStyle: 'font-size: 14px; line-height: 20px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; color: ' + (m.entrada ? '#047857' : '#0F172A')
      }))
    };
  }
}
</script>
</body>
</html>
