<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bank mobile — Início (PJ)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7FA; font-family: Inter, system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column">
    <div style="background: #0F172A; color: #FFFFFF; padding: 52px 20px 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
        <h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">Padaria Boa Massa Ltda</h1>
        <span style="flex: none; display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; background: #1E293B; color: #E2E8F0; font-size: 12px; line-height: 16px; font-weight: 600">Pessoa Jurídica</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; line-height: 20px; color: #CBD5E1">Saldo disponível</span>
        <span style="font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">R$ 3.418,70</span>
      </div>
    </div>
    <section style="margin: 16px 16px 0; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600">Receber transferências</h2>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 10px; background: #F5F7FA; border: 1px solid #E2E8F0">
        <span style="font-size: 15px; line-height: 22px; font-weight: 600; font-variant-numeric: tabular-nums">12.345.678/0001-95</span>
        <button type="button" style="height: 40px; padding: 0 12px; border: 1px solid #CBD5E1; border-radius: 8px; background: #FFFFFF; color: #0F172A; font: 600 14px/20px Inter, sans-serif">Copiar</button>
      </div>
      <span style="font-size: 12px; line-height: 16px; color: #475569">Contas PJ recebem, mas não enviam transferências.</span>
    </section>
    <section style="margin: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; overflow: hidden">
      <div style="padding: 14px 16px; border-bottom: 1px solid #E2E8F0">
        <h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Últimos recebimentos</h2>
      </div>
      <sc-for list="{{ movs }}" as="m" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #EEF2F6">
          <span style="flex: none; width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; background: #ECFDF3; color: #047857" aria-hidden="true">↓</span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 14px; line-height: 20px; font-weight: 500">{{ m.nome }}</span>
            <span style="font-size: 12px; line-height: 16px; color: #475569">{{ m.data }}</span>
          </div>
          <span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #047857; font-variant-numeric: tabular-nums; white-space: nowrap">{{ m.valor }}</span>
        </div>
      </sc-for>
    </section>
  </div>
  <nav aria-label="Principal" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 8px 8px 28px; background: #FFFFFF; border-top: 1px solid #E2E8F0">
    <a href="M-InicioPJ.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: #1D4ED8; font-size: 12px; line-height: 16px; font-weight: 600; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7v9H3z"></path><path d="M9 20v-6h6v6"></path></svg>Início</a>
    <a href="M-Extrato.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: #475569; font-size: 12px; line-height: 16px; font-weight: 500; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>Recebimentos</a>
    <a href="M-Perfil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: #475569; font-size: 12px; line-height: 16px; font-weight: 500; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
  </nav>
</div>
</x-dc>

  renderVals() {
    return {
      movs: [
