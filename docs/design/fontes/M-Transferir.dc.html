<title>Bank mobile — Transferir</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7FA; font-family: Inter, system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 4px; padding: 44px 12px 8px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0">
    <a href="M-Inicio.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #0F172A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18 9 12l6-6"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Transferir</h1>
    <span style="margin-left: auto; padding-right: 8px; font-size: 12px; line-height: 16px; color: #475569">Etapa 1 de 3</span>
  </header>
  <form style="flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="mt-doc" style="font-size: 14px; line-height: 20px; font-weight: 500">CPF ou CNPJ de quem vai receber</label>
      <input id="mt-doc" inputmode="numeric" value="12.345.678/0001-95" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 10px; font: 400 16px/24px Inter, sans-serif; color: #0F172A; background: #FFFFFF">
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E2E8F0">
      <span style="flex: none; width: 40px; height: 40px; border-radius: 999px; background: #E0E7FF; color: #1D4ED8; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700" aria-hidden="true">PB</span>
      <div style="display: flex; flex-direction: column; min-width: 0">
        <strong style="font-size: 14px; line-height: 20px">Padaria Boa Massa Ltda</strong>
        <span style="font-size: 12px; line-height: 16px; color: #475569">Pessoa Jurídica</span>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Destinatário encontrado" style="margin-left: auto; flex: none"><path d="m5 12 5 5 9-10"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="mt-valor" style="font-size: 14px; line-height: 20px; font-weight: 500">Valor</label>
      <div style="display: flex; align-items: center; gap: 8px; height: 64px; padding: 0 14px; border: 2px solid #1D4ED8; border-radius: 12px; background: #FFFFFF">
        <span style="font-size: 20px; line-height: 28px; font-weight: 600; color: #475569">R$</span>
        <input id="mt-valor" inputmode="decimal" value="45,90" style="flex: 1; min-width: 0; border: 0; outline: none; font: 600 32px/40px Inter, sans-serif; color: #0F172A; font-variant-numeric: tabular-nums; background: transparent">
      </div>
      <span style="font-size: 12px; line-height: 16px; color: #475569; font-variant-numeric: tabular-nums">Disponível: R$ 842,50</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="mt-desc" style="font-size: 14px; line-height: 20px; font-weight: 500">Descrição <span style="font-weight: 400; color: #475569">(opcional)</span></label>
      <input id="mt-desc" maxlength="200" value="Café e pães" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 10px; font: 400 16px/24px Inter, sans-serif; color: #0F172A; background: #FFFFFF">
    </div>
  </form>
  <div style="padding: 12px 20px 32px; background: #FFFFFF; border-top: 1px solid #E2E8F0">
    <a href="M-Confirmar.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #1D4ED8; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 600; text-decoration: none">Continuar</a>
  </div>
</div>
