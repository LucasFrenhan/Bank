<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Comprovante da cobrança</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="min-height: {{minH}}; background: #F5F7FA; font-family: Inter, system-ui, sans-serif; color: #0F172A; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; padding: {{pad}}">
<main style="width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 24px; align-items: stretch">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<span style="display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: #ECFDF5; color: #047857"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<h1 style="margin: 0; font-size: {{h1}}; line-height: 1.25; font-weight: 600">Pagamento aprovado</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #475569">R$ 299,90 para Cafeteria Grão Especial Ltda</p>
</div>
<section aria-label="Comprovante" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 8px 24px; box-sizing: border-box">
<sc-for list="{{linhas}}" as="l" hint-placeholder-count="6"><div style="display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: {{l.borda}}; font-size: 14px; line-height: 20px"><span style="color: #475569; flex: none">{{l.rotulo}}</span><span style="font-weight: 500; text-align: right; min-width: 0; overflow-wrap: anywhere">{{l.valor}}</span></div></sc-for>
</section>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #475569; text-align: center">A compra aparece na fatura no próximo dia útil.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<a href="{{lk.faturas}}" style="flex: 1 1 200px; display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 10px; background: #1D4ED8; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">Ver faturas</a>
<a href="{{lk.cartao}}" style="flex: 1 1 200px; display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E2E8F0; color: #0F172A; font-size: 16px; font-weight: 600; text-decoration: none; box-sizing: border-box">Voltar ao cartão</a>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mobile":{"editor":null,"default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const m = this.props.mobile === true;
    const l = [['Para', 'Cafeteria Grão Especial Ltda'], ['CNPJ', '98.765.432/0001-99'], ['Descrição', 'Assinatura Mensal Café Especial - Kit 3 Pacotes'], ['Data', '24 nov 2026, 13:35'], ['Cartão', 'Visa final 7899'], ['Código de autorização', 'AUT84K']];
    return {
      minH: m ? '1180px' : '900px', pad: m ? '40px 16px' : '72px 32px', h1: m ? '24px' : '32px',
      linhas: l.map(([rotulo, valor], i) => ({ rotulo, valor, borda: i ? '1px solid #E2E8F0' : '0' })),
      lk: { faturas: m ? 'M-Faturas.dc.html' : 'Faturas.dc.html', cartao: m ? 'M-Cartao.dc.html' : 'Main.dc.html' },
    };
  }
}
</script>
</body>
</html>
