<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Recusas e estados</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 1440px; height: 900px; background: #F5F7FA; font-family: Inter, system-ui, sans-serif; color: #0F172A; box-sizing: border-box; padding: 48px; display: flex; flex-direction: column; gap: 24px">
<h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 600">Recusas e estados</h1>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
<sc-for list="{{avisos}}" as="a" hint-placeholder-count="12">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 16px; border: 1px solid {{a.borda}}; border-radius: 10px; background: {{a.fundo}}; font-size: 14px; line-height: 20px">
<span style="font-size: 12px; line-height: 16px; color: #475569">{{a.onde}}</span>
<span style="color: {{a.cor}}; font-weight: 600">{{a.titulo}}</span>
<span style="color: #475569">{{a.texto}}</span>
<a href="#acao" style="font-weight: 600; text-decoration: none">{{a.acao}}</a>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const t = { at: ['#FFFAEB', '#FEDF89', '#B54708'], er: ['#FEF3F2', '#FECDCA', '#B42318'], ne: ['#F1F5F9', '#E2E8F0', '#0F172A'], in: ['#EFF4FF', '#C7D7FE', '#0F172A'] };
    const l = [
      ['at', 'Pagamento', 'Cartão não autorizado', 'Confira os dados do cartão e digite o CVV de novo.', 'Ver os dados do meu cartão'],
      ['at', 'Pagamento', 'Cartão bloqueado por fatura vencida', 'Pague a fatura para voltar a usar o cartão.', 'Ver faturas'],
      ['at', 'Pagamento', 'Limite insuficiente', 'Você tem R$ 150,00 de limite disponível.', 'Ver limite'],
      ['ne', 'Pagamento', 'Esta cobrança não está mais disponível', 'Ela já foi paga ou cancelada.', 'Ir para o cartão'],
      ['in', 'Pagamento sem cartão', 'Você ainda não tem um cartão', 'Peça o seu para pagar esta cobrança.', 'Solicitar cartão'],
      ['ne', 'Pagamento (PJ)', 'Só contas Pessoa Física pagam cobranças', 'Entre com a sua conta Pessoa Física para pagar.', 'Ir para o início'],
      ['ne', 'Link inválido', 'Cobrança não encontrada', 'Confira o link com quem enviou.', 'Ir para o início'],
      ['at', 'Pagar fatura', 'Saldo insuficiente', 'Você tem R$ 320,00 disponíveis e a fatura é de R$ 1.050,00.', 'Voltar à fatura'],
      ['ne', 'Cancelar cobrança', 'Esta cobrança acabou de ser paga', 'Não é mais possível cancelar.', 'Ver pagamento'],
      ['ne', 'Antecipar', 'Este recebível não pode mais ser antecipado', 'O valor integral já está previsto para hoje.', 'Ver recebíveis'],
      ['er', 'Qualquer tela', 'Algo deu errado', 'Código de suporte: 4bf92f3577b34da6a3ce929d0e0e4736', 'Tentar de novo'],
      ['ne', 'Perfil errado', 'Área indisponível para o seu tipo de conta', 'O cartão é para contas Pessoa Física.', 'Ir para o início'],
    ];
    return { avisos: l.map(([k, onde, titulo, texto, acao]) => ({ onde, titulo, texto, acao, fundo: t[k][0], borda: t[k][1], cor: t[k][2] })) };
  }
}
</script>
</body>
</html>
